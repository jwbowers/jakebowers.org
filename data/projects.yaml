      Sole-authored. A frequency-domain time-series decomposition of aggregate political participation in the United States.
    url: https://static.jakebowers.org/PAPERS/partcycles.pdf
  - title: "A Proposal for a Political Science Registry"
    description: |
      Committee report drafted with Macartan Humphreys, John Gerring, Don Green, Alan Jacobs, and Jonathan Nagler for the Society for Political Methodology, in consultation with the APSA Experimental Methods and Qualitative & Mixed Methods subsections. The committee did not use author order.
    url: https://docs.google.com/document/d/1hBvLB6LWP9NnpnA4UweMvkKmv15xnnZFv998LU1YedU/edit
  - title: "Political Participation as a Dynamic Sporadic Process in the Lives of Ordinary Americans (later 'The Shape of Political Participation')"
    description: |
      With Paul Testa, June 2012. A theory and description of how political participation varies within and across individual lives in the United States.
    url: https://static.jakebowers.org/PAPERS/BowersTesta-06-2012-Participation.pdf
  - title: "Dissertation Overview"
    description: |
      Sole-authored overview of my doctoral dissertation.
    url: https://static.jakebowers.org/PAPERS/Bowers-DissertationOverview.pdf

software:
  - title: RItools
    description: |
      This R package implements randomization inference methods for assessing
      balance in matched or stratified observational studies or randomized
      studies or causal effects in complete, blocked/stratified, and/or
      cluster-randomized studies. It implements the $d^2$ test for omnibus
      tests of the null hypothesis of no relationship between any covariate and
      treatment (for balance tests) or tests of the null hypothesis of no
      effects on any of multiple outcomes from a single treatment.
    url: https://cran.r-project.org/package=RItools
  - title: manytestsr (development)
    description: |
      A package to do many tests to localize causal effects in (sets of) experimental blocks
    url: https://bowers-illinois-edu.github.io/manytestsr/
  - title: DrBristol (development)
    description: |
      A set of functions to compute p-values and perform
      sensitivity analysis, adapting Fisher’s p-value test to case studies and
      process tracing following López and Bowers (2025). It uses unbiased and
      biased urn models to draw null distributions in the absence of
      randomization.
    url: https://bowers-illinois-edu.github.io/DrBristol/
  - title: DrWrinch (development)
    description: |
      An R package for computing fully specified Bayes factors for process
      tracing, following López, Bowers, and Gajardo Cooper (2026). Implements
      a binomial model for open-ended evidence collection and a hypergeometric
      urn model for bounded archives. Companion to DrBristol, which implements
      p-value methods for the same class of problems.
    url: https://bowers-illinois-edu.github.io/DrWrinch/
  - title: CMRSS (development)
    description: |
      R package for conducting randomization inference for quantiles of
      individual treatment effects, using combined rank sum statistics, both
      for completely randomized and stratified randomized experiments.
      Companion to Kim, Su, Bowers, and Li,
      [Randomization Tests for Distributions of Individual Treatment Effects via Combined Rank Statistics](https://arxiv.org/abs/2605.08027).
    url: https://bowers-illinois-edu.github.io/CMRSS/
