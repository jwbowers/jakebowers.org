backburner:
  - title: "How to Increase the Precision of Causal Inferences in Experiments Using Machine Learning (but without Data Snooping)"
    description: |
      With Mark Fredrickson and Ben Hansen. On using covariates and machine learning to improve precision in randomization-based causal inferences without data snooping.
    url: https://static.jakebowers.org/PAPERS/BowersFredricksonHansen-MachineLearningExperiments.pdf
  - title: "Ethnicity and Electoral Fraud in New Democracies: Modelling Political Party Agents in Ghana"
    description: |
      With Nahomi Ichino and Mark Fredrickson. Randomization inference with agent-based models of network propagation of voter registration fraud for theories of party competition and ethnicity in Ghana.
    url: https://static.jakebowers.org/PAPERS/Ichino-Bowers-Fredrickson-Ghana.pdf
  - title: "Regression without Regrets: A Modular Approach to Linear Models in (Quasi-)Experiments"
    description: |
      With Mark Fredrickson and Costas Panagopoulos. A modular use of penalized linear machine-learning models in (quasi-)experiments, framed by randomization inference.
    url: https://static.jakebowers.org/PAPERS/BowersFredricksonPanagopoulosMPSA.pdf
  - title: "Fisher's Randomization Mode of Statistical Inference, Then and Now"
    description: |
      With Costas Panagopoulos. On Fisher's randomization-based mode of statistical inference, its history and its current uses.
    url: https://static.jakebowers.org/PAPERS/BowPan-Fisher.pdf
  - title: "A General Representation of Potential Outcomes for Graphs/Networks"
    description: |
      Sole-authored draft, 2012. A potential-outcomes representation for outcomes that depend on graph or network structure.
    url: https://static.jakebowers.org/PAPERS/Bowers2012-WritingInterference.pdf
  - title: "Fixing Broken Experiments: How to Bolster the Case for Ignorability with Full Matching"
    description: |
      With Ben Hansen, August 2007. On using full matching to bolster ignorability assumptions in compromised experiments.
    url: https://static.jakebowers.org/PAPERS/bolsterIVAug2007.pdf
  - title: "Cycling Involvements: Frequency Domain Time Series Analysis and Political Participation in the USA"
